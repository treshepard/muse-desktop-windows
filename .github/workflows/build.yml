name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore -r ${{ matrix.rid }}

      - name: Publish (${{ matrix.rid }})
        run: dotnet publish MuseDesktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true --no-restore -o publish/${{ matrix.rid }}

      - name: Zip the publish output
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath Muse-${{ matrix.rid }}.zip

      - name: Upload the zip as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muse-${{ matrix.rid }}
          path: Muse-${{ matrix.rid }}.zip
          if-no-files-found: error
